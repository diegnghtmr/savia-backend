  # Branch protection requires a status named `check`. This job keeps that
  # contract and passes only when every job above passed.
  check:
    name: check
    if: always()
    needs: [static, integration]
    runs-on: ubuntu-latest
    steps:
      - name: require static and every integration shard
        shell: bash
        run: |
          echo "static=${{ needs.static.result }} integration=${{ needs.integration.result }}"
          test "${{ needs.static.result }}" = success
          test "${{ needs.integration.result }}" = success
