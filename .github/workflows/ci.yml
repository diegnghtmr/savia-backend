name: CI

on:
  pull_request:
  push:
    branches: [main]

# Supersede an in-flight run when a branch is pushed again. Without this, every
# correction pushed to an open pull request left the previous run consuming a
# full ~55 minute slot that could no longer tell us anything useful.
# main is deliberately exempt: a run there validates a commit that has already
# landed, so it must finish rather than be replaced by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: database RLS contract
        shell: bash
        run: |
          workdir="$(mktemp -d)"
          project_id="savia-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            pnpm exec supabase --workdir "$workdir" stop --no-backup || true
            rm -rf "$workdir"
          }
          trap cleanup EXIT
          mkdir -p "$workdir/supabase/migrations" "$workdir/supabase/tests/database"
          cp supabase/config.toml "$workdir/supabase/config.toml"
          cp supabase/migrations/*.sql "$workdir/supabase/migrations/"
          cp supabase/tests/database/identity_rls.test.sql "$workdir/supabase/tests/database/"
          sed -i "s/^project_id = .*/project_id = \"$project_id\"/" "$workdir/supabase/config.toml"
          pnpm exec supabase --workdir "$workdir" start
          eval "$(pnpm exec supabase --workdir "$workdir" status -o env)"
          : "${DB_URL:?Supabase status did not export DB_URL}"
          pnpm exec supabase --workdir "$workdir" db reset --no-seed
          pnpm exec supabase --workdir "$workdir" test db --local \
            "$workdir/supabase/tests/database/identity_rls.test.sql"
      - name: database bootstrap contract
        shell: bash
        run: |
          workdir="$(mktemp -d)"
          project_id="savia-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            pnpm exec supabase --workdir "$workdir" stop --no-backup || true
            rm -rf "$workdir"
          }
          trap cleanup EXIT
          mkdir -p "$workdir/supabase/migrations" "$workdir/supabase/tests/database"
          cp supabase/config.toml "$workdir/supabase/config.toml"
          cp supabase/migrations/20260715000[12]_*.sql "$workdir/supabase/migrations/"
          cp supabase/tests/database/identity_bootstrap_rls.test.sql "$workdir/supabase/tests/database/"
          sed -i "s/^project_id = .*/project_id = \"$project_id\"/" "$workdir/supabase/config.toml"
          pnpm exec supabase --workdir "$workdir" start
          eval "$(pnpm exec supabase --workdir "$workdir" status -o env)"
          : "${DB_URL:?Supabase status did not export DB_URL}"
          pnpm exec supabase --workdir "$workdir" db reset --no-seed
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into auth.users (id, email) values ('00000000-0000-0000-0000-000000000104', 'preflight@example.test'); insert into public.profiles (id, email, display_name, locale, country_code, timezone, date_format, week_starts_on, number_format, default_currency) values ('00000000-0000-0000-0000-000000000104', 'preflight@example.test', 'Preflight', 'en', 'US', 'UTC', 'YYYY-MM-DD', 1, '1,000.00', 'USD');"
          cp supabase/migrations/202607150003_identity_bootstrap_rls.sql "$workdir/supabase/migrations/"
          if output="$(pnpm exec supabase --workdir "$workdir" db push --local 2>&1)"; then exit 1; fi
          printf '%s\n' "$output"
          case "$output" in *'existing profile bootstrap aggregate is incomplete'*) ;; *) exit 1;; esac
          rm "$workdir/supabase/migrations/202607150003_identity_bootstrap_rls.sql"
          pnpm exec supabase --workdir "$workdir" db reset --no-seed
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into auth.users (id, email) values ('00000000-0000-0000-0000-000000000104', 'preflight@example.test'); insert into public.profiles (id, email, display_name, locale, country_code, timezone, date_format, week_starts_on, number_format, default_currency) values ('00000000-0000-0000-0000-000000000104', 'preflight@example.test', 'Preflight', 'en', 'US', 'UTC', 'YYYY-MM-DD', 1, '1,000.00', 'USD');"
          sed '/^do \$\$/, /^\$\$;/d' supabase/migrations/202607150003_identity_bootstrap_rls.sql > "$workdir/supabase/migrations/202607150003_identity_bootstrap_rls.sql"
          pnpm exec supabase --workdir "$workdir" db push --local
          test "$(psql "$DB_URL" -Atc "select count(*) from public.profiles where id = '00000000-0000-0000-0000-000000000104'")" = 1
          pnpm exec supabase --workdir "$workdir" db reset --no-seed
          cp supabase/migrations/202607150003_identity_bootstrap_rls.sql "$workdir/supabase/migrations/"
          pnpm exec supabase --workdir "$workdir" db reset --no-seed
          pnpm exec supabase --workdir "$workdir" test db --local \
            "$workdir/supabase/tests/database/identity_bootstrap_rls.test.sql"
      - name: database schema contract
        shell: bash
        timeout-minutes: 15
        run: pnpm test:schema-contract
      - name: postgres pool integration
        shell: bash
        run: pnpm test:integration:postgres-pool
      - name: transaction integration
        shell: bash
        run: pnpm test:integration:transaction
      - name: transaction resilience integration
        shell: bash
        run: pnpm test:integration:transaction-resilience
      - name: bootstrap integration
        shell: bash
        run: pnpm test:integration:bootstrap
      - name: profile integration
        shell: bash
        run: pnpm test:integration:profile
      - name: workspace integration
        shell: bash
        run: pnpm test:integration:workspace
      - name: workspace write rls integration
        shell: bash
        run: pnpm test:integration:workspace-write-rls
      - name: membership write rls integration
        shell: bash
        run: pnpm test:integration:membership-write-rls
      - name: last owner guard integration
        shell: bash
        run: pnpm test:integration:last-owner-guard
      - name: workspace members integration
        shell: bash
        run: pnpm test:integration:workspace-members
      - name: update workspace member integration
        shell: bash
        run: pnpm test:integration:update-workspace-member
      - name: remove workspace member integration
        shell: bash
        run: pnpm test:integration:remove-workspace-member
      - name: workspace invitations schema integration
        shell: bash
        run: pnpm test:integration:workspace-invitations-schema
      - name: workspace invitations integration
        shell: bash
        run: pnpm test:integration:workspace-invitations
      - name: revoke workspace invitation integration
        shell: bash
        run: pnpm test:integration:revoke-workspace-invitation
      - name: command idempotency integration
        shell: bash
        run: pnpm test:integration:command-idempotency
      - name: accounts schema integration
        shell: bash
        run: pnpm test:integration:accounts-schema
      - name: list accounts integration
        shell: bash
        run: pnpm test:integration:list-accounts
      - name: get account integration
        shell: bash
        run: pnpm test:integration:get-account
      - name: create account integration
        shell: bash
        run: pnpm test:integration:create-account
      - name: update account integration
        shell: bash
        run: pnpm test:integration:update-account
      - name: accounts balance integration
        shell: bash
        run: pnpm test:integration:accounts-balance
      - name: accounts close integration
        shell: bash
        run: pnpm test:integration:accounts-close
      - name: account currency invariant integration
        shell: bash
        run: pnpm test:integration:account-currency-invariant
      - name: transactions schema integration
        shell: bash
        run: pnpm test:integration:transactions-schema
      - name: ledger postings schema integration
        shell: bash
        run: pnpm test:integration:ledger-postings-schema
      - name: transactions create integration
        shell: bash
        run: pnpm test:integration:transactions-create
      - name: transactions get integration
        shell: bash
        run: pnpm test:integration:transactions-get
      - name: transactions list integration
        shell: bash
        run: pnpm test:integration:transactions-list
      - name: transactions update integration
        shell: bash
        run: pnpm test:integration:transactions-update
      - name: transactions void integration
        shell: bash
        run: pnpm test:integration:transactions-void
      - name: transfers schema integration
        shell: bash
        run: pnpm test:integration:transfers-schema
      - name: transfers create integration
        shell: bash
        run: pnpm test:integration:transfers-create
      - name: exchange rates schema integration
        shell: bash
        run: pnpm test:integration:exchange-rates-schema
      - name: exchange rates create integration
        shell: bash
        run: pnpm test:integration:exchange-rates-create
      - name: exchange rates list integration
        shell: bash
        run: pnpm test:integration:exchange-rates-list
      - name: transaction mutation
        shell: bash
        run: pnpm test:mutation:transaction
