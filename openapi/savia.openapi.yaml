              examples:
                discarded:
                  value:
                    id: d8f08356-45ac-47b8-8120-09e513e4be72
                    payeeName: Stream Service
                    currentAmount:
                      amountMinor: '1399'
                      currency: USD
                    frequency: monthly
                    status: ignored
                    etag: '"2"'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
