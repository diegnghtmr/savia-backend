  /v1/cli/device/approve:
    post:
      operationId: approveCliDeviceAuthorization
      summary: Approve CLI device authorization
      description: Approve a pending CLI device authorization using the authenticated session subject. Re-approval by the same subject also succeeds with 204. This endpoint is limited to 10 attempts per minute per subject.
      tags:
        - CLI Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliDeviceApprovalRequest'
      responses:
        '204':
          description: Device authorization approved, including re-approval by the same subject.
        '400':
          description: One fixed, indistinguishable outcome for an unknown, expired, already-approved-by-another or redeemed code, or for invalid request-body shape.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: A CLI token can never approve a device authorization.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/mcp/proposals:
    post:
      operationId: createMcpProposal
      summary: Propose an MCP action that requires approval
      description: Creates a pending approval without executing the action. The API resolves the subject and grant from the authenticated grant-bound OAuth context, and the workspace from X-Workspace-Id. The API checks the tool's required scopes from x-savia-mcp-tool, the current workspace permissions and the grant restrictions before accepting the proposal. It validates and normalizes the tool arguments and derives the risk classification, preview and argument hash itself. The approval is bound to the subject, workspace, tool, grant and exact normalized arguments. Only the creator can confirm it in Savia web or mobile; confirmation executes the action.
      security:
        - mcpOAuth: []
      tags:
        - Approvals
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMcpProposalRequest'
      responses:
        '201':
          description: Pending approval created. An identical replay with the same key returns the original response without creating another approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpProposalApproval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller or grant does not authorize this operation, tool or amount in this workspace.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Unknown tool, read tool, tool not requiring approval, or invalid tool arguments.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
