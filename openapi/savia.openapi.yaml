      description: A workspace writer can apply the same action to 1 to 100 distinct transactions in the selected workspace. Authorization, eligibility and expected versions are checked for all targets. All updates commit together, or none do; any affected ledger postings must remain balanced. An authorized replay of the same Idempotency-Key and request returns the original result without applying the action again. A stale expectedVersion on any target returns 412. Reusing a key with a different request returns 409.
