openapi: 3.1.1
info:
  title: Savia Backend Executable API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:3000
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT verified against the configured issuer, audience, and JWKS.
    mcpOAuth:
      type: oauth2
      description: OAuth 2.1 authorization used by remote MCP clients. The MCP transport itself is not described by this OpenAPI document.
      flows:
        authorizationCode:
          authorizationUrl: https://api.savia.app/oauth/authorize
          tokenUrl: https://api.savia.app/oauth/token
          scopes:
            accounts:read: Read accounts and balances.
            transactions:read: Read financial transactions.
            transactions:write: Create and modify financial transactions.
            budgets:read: Read budgets.
            budgets:write: Modify budgets.
            reports:read: Run and read reports.
            reports:write: Create report definitions.
            workspace:admin: Administer workspace integrations.
  schemas:
    OnboardingRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - displayName
        - locale
        - countryCode
        - timezone
        - dateFormat
        - weekStartsOn
        - numberFormat
        - defaultCurrency
        - workspaceName
        - baseCurrency
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        locale:
          type: string
          description: BCP 47 language tag supported by the runtime.
          examples: [en-US]
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 code.
          pattern: '^[A-Za-z]{2}$'
        timezone:
          type: string
          description: IANA timezone identifier.
          examples: [America/Bogota]
        dateFormat:
          type: string
          enum: [DD/MM/YYYY, MM/DD/YYYY, YYYY-MM-DD]
        weekStartsOn:
          type: integer
          minimum: 0
          maximum: 6
        numberFormat:
          type: string
          enum: ['1,234.56', '1.234,56']
        defaultCurrency:
          type: string
          description: Active ISO 4217 currency code.
          pattern: '^[A-Za-z]{3}$'
        workspaceName:
          type: string
          minLength: 1
          maxLength: 120
        baseCurrency:
          type: string
          description: Active ISO 4217 currency code.
          pattern: '^[A-Za-z]{3}$'
        privacyModeEnabled:
          type: boolean
          default: false
    OnboardingAggregate:
      type: object
      additionalProperties: false
      required: [profileId, workspaceId]
      properties:
        profileId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
    FieldViolation:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      additionalProperties: false
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
          default: []
        retryable:
          type: boolean
          default: false
      additionalProperties: true
    UpdateUserProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        locale:
          type: string
          description: BCP 47 language tag supported by the runtime.
          examples: [en-US]
        timezone:
          type: string
          description: IANA timezone identifier.
          examples: [America/Bogota]
        defaultCurrency:
          type: string
          description: Active ISO 4217 currency code.
          pattern: '^[A-Za-z]{3}$'
        privacyModeEnabled:
          type: boolean
    UserProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - locale
        - timezone
        - defaultCurrency
        - privacyModeEnabled
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        locale:
          type: string
        timezone:
          type: string
        defaultCurrency:
          type: string
          pattern: '^[A-Za-z]{3}$'
        privacyModeEnabled:
          type: boolean
    Workspace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - baseCurrency
        - role
        - createdAt
        - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          type: string
          enum: [personal, family, shared]
        baseCurrency:
          type: string
          pattern: '^[A-Za-z]{3}$'
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    WorkspaceMember:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - displayName
        - role
        - status
        - joinedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
        status:
          type: string
          enum: [active, suspended]
        joinedAt:
          type: string
          format: date-time
    UpdateWorkspaceMemberRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - baseCurrency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          type: string
          enum: [family, shared]
          default: family
        baseCurrency:
          type: string
          description: Active ISO 4217 currency code.
          pattern: '^[A-Za-z]{3}$'
    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        baseCurrency:
          type: string
          description: Active ISO 4217 currency code.
          pattern: '^[A-Za-z]{3}$'
    PageInfo:
      type: object
      additionalProperties: false
      required:
        - hasNextPage
      properties:
        nextCursor:
          type:
            - string
            - 'null'
        hasNextPage:
          type: boolean
    WorkspaceInvitation:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - role
        - status
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateWorkspaceInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
    AccountType:
      type: string
      enum:
        - cash
        - savings
        - checking
        - digital_wallet
        - credit_card
        - loan
        - investment_manual
        - receivable
        - generic
    AccountStatus:
      type: string
      enum: [active, archived, closed]
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - type
        - currency
        - status
        - includeInNetWorth
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        status:
          $ref: '#/components/schemas/AccountStatus'
        institution:
          type:
            - string
            - 'null'
          maxLength: 120
        maskedNumber:
          type:
            - string
            - 'null'
          maxLength: 32
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        colorToken:
          type:
            - string
            - 'null'
        icon:
          type:
            - string
            - 'null'
        includeInNetWorth:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    Date:
      type: string
      format: date
    AmountMinor:
      type: string
      pattern: '^-?[0-9]+$'
      description: Signed integer minor-unit amount serialized as a string to avoid JavaScript precision loss.
      examples:
        - '125000'
        - '-5000'
    DecimalString:
      type: string
      pattern: '^-?[0-9]+(?:\.[0-9]+)?$'
      examples:
        - '4123.450000000000000000'
    Money:
      type: object
      required:
        - amountMinor
        - currency
      properties:
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      additionalProperties: false
    ConvertedMoney:
      type: object
      required:
        - original
        - converted
        - rate
        - rateDate
        - rateSource
      properties:
        original:
          $ref: '#/components/schemas/Money'
        converted:
          $ref: '#/components/schemas/Money'
        rate:
          $ref: '#/components/schemas/DecimalString'
        rateDate:
          $ref: '#/components/schemas/Date'
        rateSource:
          type: string
      additionalProperties: false
    AccountBalance:
      type: object
      required:
        - accountId
        - nativeBalance
        - baseCurrencyEquivalent
        - asOf
      properties:
        accountId:
          type: string
          format: uuid
        nativeBalance:
          $ref: '#/components/schemas/Money'
        pendingBalance:
          $ref: '#/components/schemas/Money'
        availableBalance:
          $ref: '#/components/schemas/Money'
        reconciledBalance:
          $ref: '#/components/schemas/Money'
        baseCurrencyEquivalent:
          $ref: '#/components/schemas/ConvertedMoney'
        asOf:
          type: string
          format: date-time
      additionalProperties: false
    CreateAccountRequest:
      type: object
      required:
        - name
        - type
        - currency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        openingBalance:
          $ref: '#/components/schemas/Money'
        openingBalanceDate:
          $ref: '#/components/schemas/Date'
        institution:
          type: string
          maxLength: 120
        maskedNumber:
          type: string
          maxLength: 32
        description:
          type: string
          maxLength: 500
        includeInNetWorth:
          type: boolean
          default: true
      additionalProperties: false
    UpdateAccountRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        institution:
          type:
            - string
            - 'null'
          maxLength: 120
        maskedNumber:
          type:
            - string
            - 'null'
          maxLength: 32
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        includeInNetWorth:
          type: boolean
        status:
          type: string
          enum:
            - active
            - archived
      additionalProperties: false
      minProperties: 1
    TransactionStatus:
      type: string
      enum:
        - draft
        - pending
        - confirmed
        - reconciled
        - voided
    TransactionType:
      type: string
      enum:
        - income
        - expense
        - adjustment
        - refund
        - debt_payment
        - fund_contribution
    TransactionSplit:
      type: object
      additionalProperties: false
      required:
        - amount
        - categoryId
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        categoryId:
          type: string
          format: uuid
        notes:
          type:
            - string
            - 'null'
          maxLength: 500
        tagIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
    Transaction:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - status
        - accountId
        - amount
        - occurredAt
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        accountId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        baseCurrencyAmount:
          $ref: '#/components/schemas/ConvertedMoney'
        occurredAt:
          type: string
          format: date-time
        categoryId:
          type:
            - string
            - 'null'
          format: uuid
        payeeId:
          type:
            - string
            - 'null'
          format: uuid
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        notes:
          type:
            - string
            - 'null'
          maxLength: 2000
        tagIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        splits:
          type: array
          items:
            $ref: '#/components/schemas/TransactionSplit'
        source:
          type: string
          enum:
            - web
            - mobile
            - cli
            - mcp
            - agent
            - import
            - system
        receiptId:
          type:
            - string
            - 'null'
          format: uuid
        reconciliationId:
          type:
            - string
            - 'null'
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    CreateTransactionRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - accountId
        - amount
        - occurredAt
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        accountId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        occurredAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - draft
            - pending
            - confirmed
          default: confirmed
        categoryId:
          type:
            - string
            - 'null'
          format: uuid
        payeeId:
          type:
            - string
            - 'null'
          format: uuid
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        notes:
          type:
            - string
            - 'null'
          maxLength: 2000
        tagIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        splits:
          type: array
          items:
            $ref: '#/components/schemas/TransactionSplit'
        receiptId:
          type:
            - string
            - 'null'
          format: uuid
    UpdateTransactionRequest:
      type: object
      properties:
        occurredAt:
          type: string
          format: date-time
        categoryId:
          type:
            - string
            - 'null'
          format: uuid
        payeeId:
          type:
            - string
            - 'null'
          format: uuid
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        notes:
          type:
            - string
            - 'null'
          maxLength: 2000
        tagIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        splits:
          type: array
          items:
            $ref: '#/components/schemas/TransactionSplit'
        status:
          type: string
          enum:
            - draft
            - pending
            - confirmed
      additionalProperties: false
      minProperties: 1
    VoidTransactionRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
      additionalProperties: false
    Transfer:
      type: object
      additionalProperties: false
      required:
        - id
        - sourceAccountId
        - destinationAccountId
        - sourceAmount
        - destinationAmount
        - occurredAt
        - status
      properties:
        id:
          type: string
          format: uuid
        sourceAccountId:
          type: string
          format: uuid
        destinationAccountId:
          type: string
          format: uuid
        sourceAmount:
          $ref: '#/components/schemas/Money'
        destinationAmount:
          $ref: '#/components/schemas/Money'
        fee:
          $ref: '#/components/schemas/Money'
        exchangeRate:
          anyOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        referenceRate:
          anyOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        occurredAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/TransactionStatus'
        transactionId:
          type: string
          format: uuid
    CreateTransferRequest:
      type: object
      additionalProperties: false
      required:
        - sourceAccountId
        - destinationAccountId
        - amount
        - occurredAt
      properties:
        sourceAccountId:
          type: string
          format: uuid
        destinationAccountId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        occurredAt:
          type: string
          format: date-time
        fee:
          $ref: '#/components/schemas/Money'
        description:
          type:
            - string
            - 'null'
          maxLength: 500
    CreateCurrencyExchangeRequest:
      type: object
      additionalProperties: false
      required:
        - sourceAccountId
        - destinationAccountId
        - sourceAmount
        - destinationAmount
        - executedRate
        - occurredAt
      properties:
        sourceAccountId:
          type: string
          format: uuid
        destinationAccountId:
          type: string
          format: uuid
        sourceAmount:
          $ref: '#/components/schemas/Money'
        destinationAmount:
          $ref: '#/components/schemas/Money'
        executedRate:
          $ref: '#/components/schemas/DecimalString'
        referenceRate:
          anyOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        fee:
          $ref: '#/components/schemas/Money'
        occurredAt:
          type: string
          format: date-time
        description:
          type:
            - string
            - 'null'
          maxLength: 500
    ExchangeRate:
      type: object
      additionalProperties: false
      required:
        - id
        - baseCurrency
        - quoteCurrency
        - rate
        - effectiveAt
        - source
      properties:
        id:
          type: string
          format: uuid
        baseCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        quoteCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        rate:
          $ref: '#/components/schemas/DecimalString'
        effectiveAt:
          type: string
          format: date-time
        source:
          type: string
        manual:
          type: boolean
    CreateManualExchangeRateRequest:
      type: object
      additionalProperties: false
      required:
        - baseCurrency
        - quoteCurrency
        - rate
        - effectiveAt
      properties:
        baseCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        quoteCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        rate:
          $ref: '#/components/schemas/DecimalString'
        effectiveAt:
          type: string
          format: date-time
        notes:
          type:
            - string
            - 'null'
          maxLength: 500
    NamedResource:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        archived:
          type: boolean
          default: false
    Category:
      allOf:
        - $ref: '#/components/schemas/NamedResource'
        - type: object
          properties:
            parentId:
              type:
                - string
                - 'null'
              format: uuid
            kind:
              type: string
              enum:
                - income
                - expense
                - transfer
                - other
            icon:
              type:
                - string
                - 'null'
            colorToken:
              type:
                - string
                - 'null'
    Tag:
      allOf:
        - $ref: '#/components/schemas/NamedResource'
    Payee:
      allOf:
        - $ref: '#/components/schemas/NamedResource'
    CreateNamedResourceRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - kind
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          type: string
          enum:
            - income
            - expense
            - transfer
            - other
        parentId:
          type:
            - string
            - 'null'
          format: uuid
        icon:
          type:
            - string
            - 'null'
        colorToken:
          type:
            - string
            - 'null'
    RecurringRule:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - frequency
        - behavior
        - active
        - nextOccurrenceAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        frequency:
          type: string
          enum:
            - daily
            - weekly
            - biweekly
            - monthly
            - yearly
            - custom
        rrule:
          type:
            - string
            - 'null'
        behavior:
          type: string
          enum:
            - remind
            - create_draft
            - create_pending
            - confirm_automatically
        template:
          $ref: '#/components/schemas/CreateTransactionRequest'
        active:
          type: boolean
        nextOccurrenceAt:
          type: string
          format: date-time
    CreateRecurringRuleRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - frequency
        - behavior
        - template
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        frequency:
          type: string
          enum:
            - daily
            - weekly
            - biweekly
            - monthly
            - yearly
            - custom
        rrule:
          type:
            - string
            - 'null'
        behavior:
          type: string
          enum:
            - remind
            - create_draft
            - create_pending
            - confirm_automatically
        template:
          $ref: '#/components/schemas/CreateTransactionRequest'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type:
            - string
            - 'null'
          format: date-time
    Subscription:
      type: object
      additionalProperties: false
      required:
        - id
        - payeeName
        - currentAmount
        - frequency
        - status
      properties:
        id:
          type: string
          format: uuid
        payeeName:
          type: string
        currentAmount:
          $ref: '#/components/schemas/Money'
        previousAmount:
          $ref: '#/components/schemas/Money'
        increasePercent:
          type:
            - number
            - 'null'
        frequency:
          type: string
        nextExpectedAt:
          type:
            - string
            - 'null'
          format: date-time
        status:
          type: string
          enum:
            - detected
            - confirmed
            - ignored
            - cancelled
    Job:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
