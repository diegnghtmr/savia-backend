        schema:
          $ref: '#/components/schemas/Uuid'
      - $ref: '#/components/parameters/WorkspaceIdHeader'
    post:
      operationId: rejectApproval
      summary: Reject pending action
      description: Only the approval creator (`createdBy`) can reject with a user session from Savia web or mobile. Any other subject, including a workspace owner or administrator, receives 403.
      tags:
