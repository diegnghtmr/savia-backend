        targetAmount:
          $ref: '#/components/schemas/Money'
        currentAmount:
          $ref: '#/components/schemas/Money'
        targetDate:
          type:
            - string
            - 'null'
          format: date
        linkedAccountId:
          type:
            - string
            - 'null'
          format: uuid
        recommendedMonthlyContribution:
          $ref: '#/components/schemas/Money'
        objective:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Optional description of what the fund is for.
        responsibleMemberIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
          description: Workspace membership IDs of the people responsible for the fund. This does not grant access.
        etag:
          type: string
          description: Current fund ETag, usable as If-Match. Always present on detail and update responses.
          examples:
            - '"7"'
        status:
          type: string
          enum:
            - active
            - completed
            - paused
            - archived
      additionalProperties: false
    FundDetail:
      allOf:
        - $ref: '#/components/schemas/Fund'
      required:
        - etag
    CreateFundRequest:
      type: object
      required:
        - name
        - currency
        - targetAmount
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        targetAmount:
          $ref: '#/components/schemas/Money'
        targetDate:
          type:
            - string
            - 'null'
          format: date
        linkedAccountId:
          type:
            - string
            - 'null'
          format: uuid
      additionalProperties: false
    UpdateFundRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Non-blank fund name.
        objective:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 500
          description: Non-blank purpose of the fund. Use null to clear it.
        targetAmount:
          $ref: '#/components/schemas/PositiveFundAmount'
        targetDate:
          type:
            - string
            - 'null'
          format: date
          description: Use null to clear the target date.
        linkedAccountId:
          type:
            - string
            - 'null'
          format: uuid
          description: An account in the same workspace. Use null to unlink it. Neither change moves money.
        responsibleMemberIds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Uuid'
          description: Replaces the list with active workspace membership IDs. Use an empty array to clear it.
      additionalProperties: false
    PositiveFundAmount:
      type: object
      description: A positive amount in the fund's native currency.
      required:
        - amountMinor
        - currency
      properties:
        amountMinor:
          type: string
          pattern: ^0*[1-9][0-9]*$
          description: Positive minor-unit integer within the signed 64-bit range, serialized as a string.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      additionalProperties: false
    CreateFundWithdrawalRequest:
      type: object
      required:
        - accountId
        - amount
        - reason
      properties:
        accountId:
          $ref: '#/components/schemas/Uuid'
          description: Destination account in the same workspace. It must not be closed and must use the fund's currency.
        amount:
          $ref: '#/components/schemas/PositiveFundAmount'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Non-blank explanation for the withdrawal, recorded in the ledger transaction.
      additionalProperties: false
    CreateFundContributionRequest:
      type: object
      required:
        - accountId
        - amount
        - occurredAt
      properties:
        accountId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/Money'
        occurredAt:
          $ref: '#/components/schemas/DateTime'
        notes:
          type:
            - string
            - 'null'
          maxLength: 500
      additionalProperties: false
    Debt:
      type: object
      required:
        - id
        - name
        - currency
        - principal
        - outstandingBalance
        - annualRate
        - status
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        principal:
          $ref: '#/components/schemas/Money'
        outstandingBalance:
          $ref: '#/components/schemas/Money'
        annualRate:
          $ref: '#/components/schemas/DecimalString'
        rateType:
          type: string
          enum:
            - fixed
            - variable
        minimumPayment:
          $ref: '#/components/schemas/Money'
        nextPaymentAt:
          type:
            - string
            - 'null'
          format: date
        status:
          type: string
          enum:
            - active
            - paid
            - defaulted
            - archived
      additionalProperties: false
    CreateDebtRequest:
      type: object
      required:
        - name
        - principal
        - annualRate
        - rateType
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        principal:
          $ref: '#/components/schemas/Money'
        annualRate:
          $ref: '#/components/schemas/DecimalString'
        rateType:
          type: string
          enum:
            - fixed
            - variable
        minimumPayment:
          $ref: '#/components/schemas/Money'
        startDate:
          $ref: '#/components/schemas/Date'
        termMonths:
          type:
            - integer
            - 'null'
          minimum: 1
      additionalProperties: false
    DebtProjectionStrategy:
      type: string
      enum:
        - minimum_payment
        - snowball
        - avalanche
        - custom_extra
    DebtProjection:
      type: object
      required:
        - debtId
        - strategy
        - asOf
        - startingBalance
        - totalInterest
        - totalCost
        - estimatedPayoffDate
        - schedule
      properties:
        debtId:
          $ref: '#/components/schemas/Uuid'
        strategy:
          $ref: '#/components/schemas/DebtProjectionStrategy'
        asOf:
          $ref: '#/components/schemas/Date'
          description: Effective workspace-local calculation date.
        startingBalance:
          $ref: '#/components/schemas/Money'
          description: Outstanding balance at the start of the simulation, in the debt's currency.
        totalInterest:
          $ref: '#/components/schemas/Money'
          description: Projected remaining interest in the debt's currency.
        totalCost:
          $ref: '#/components/schemas/Money'
          description: Projected remaining principal plus interest in the debt's currency; excludes future fees and insurance not modeled in the schedule.
        estimatedPayoffDate:
          $ref: '#/components/schemas/Date'
          description: Date the projected balance reaches zero, or asOf if it is already zero.
        schedule:
          type: array
          description: Projected payments in ascending due-date order; empty if already paid off.
          items:
            $ref: '#/components/schemas/DebtProjectionPayment'
      additionalProperties: false
    DebtProjectionPayment:
      type: object
      description: One projected installment. All amounts are in the debt's currency.
      required:
        - dueDate
        - paymentAmount
        - principalAmount
        - interestAmount
        - remainingBalance
      properties:
        dueDate:
          $ref: '#/components/schemas/Date'
        paymentAmount:
          $ref: '#/components/schemas/Money'
          description: Principal plus interest paid on this date.
        principalAmount:
          $ref: '#/components/schemas/Money'
        interestAmount:
          $ref: '#/components/schemas/Money'
        remainingBalance:
          $ref: '#/components/schemas/Money'
          description: Principal still outstanding after the projected payment.
      additionalProperties: false
    CreateDebtPaymentRequest:
      type: object
      required:
        - accountId
        - totalAmount
        - occurredAt
      properties:
        accountId:
          $ref: '#/components/schemas/Uuid'
        totalAmount:
          $ref: '#/components/schemas/Money'
        principalAmount:
          $ref: '#/components/schemas/Money'
        interestAmount:
          $ref: '#/components/schemas/Money'
        feeAmount:
          $ref: '#/components/schemas/Money'
        occurredAt:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: false
    ExchangeRate:
      type: object
      required:
        - id
        - baseCurrency
        - quoteCurrency
        - rate
        - effectiveAt
        - source
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        baseCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        quoteCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        rate:
          $ref: '#/components/schemas/DecimalString'
        effectiveAt:
          $ref: '#/components/schemas/DateTime'
        source:
          type: string
        manual:
          type: boolean
        isStale:
          type: boolean
          description: Whether the rate is stale at response time. A rate with source `frankfurter` is stale when at least 72 hours have elapsed since `effectiveAt`. Manual rates are never stale.
        ageHours:
          type: number
          description: Time from `effectiveAt` to response time, in hours (may be fractional). Applies to both provider and manual rates.
      additionalProperties: false
    CreateManualExchangeRateRequest:
      type: object
      required:
        - baseCurrency
        - quoteCurrency
        - rate
        - effectiveAt
      properties:
        baseCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        quoteCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        rate:
          $ref: '#/components/schemas/DecimalString'
        effectiveAt:
          $ref: '#/components/schemas/DateTime'
        notes:
          type:
            - string
            - 'null'
          maxLength: 500
      additionalProperties: false
    AnalyticsSummary:
      type: object
      required:
        - periodStart
        - periodEnd
        - baseCurrency
        - netWorth
        - income
        - expenses
        - savingsCapacity
      properties:
        periodStart:
          $ref: '#/components/schemas/Date'
        periodEnd:
          $ref: '#/components/schemas/Date'
        baseCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        netWorth:
          $ref: '#/components/schemas/Money'
        assets:
          $ref: '#/components/schemas/Money'
        debts:
          $ref: '#/components/schemas/Money'
        income:
          $ref: '#/components/schemas/Money'
        expenses:
          $ref: '#/components/schemas/Money'
        savingsCapacity:
          $ref: '#/components/schemas/Money'
        budgetUtilizationPercent:
          type: number
        fxRatesUsed:
          $ref: '#/components/schemas/FxRatesUsed'
          description: Present when the result uses currency conversion.
      additionalProperties: false
    TimeSeriesPoint:
      type: object
      required:
        - period
        - value
      properties:
        period:
          type: string
        value:
          $ref: '#/components/schemas/Money'
        secondaryValue:
          $ref: '#/components/schemas/Money'
      additionalProperties: false
    CategoryBreakdownItem:
      type: object
      required:
        - categoryId
        - categoryName
        - amount
        - percentage
      properties:
        categoryId:
          $ref: '#/components/schemas/Uuid'
        categoryName:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        percentage:
          type: number
      additionalProperties: false
    CashFlowAnalytics:
      type: object
      required:
        - series
        - categories
      properties:
        series:
          type: array
          items:
            $ref: '#/components/schemas/TimeSeriesPoint'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryBreakdownItem'
        fxRatesUsed:
          $ref: '#/components/schemas/FxRatesUsed'
          description: Present when the result uses currency conversion.
      additionalProperties: false
    AnalyticsFilterIds:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        $ref: '#/components/schemas/Uuid'
    AdvancedAnalyticsMetric:
      type: string
      enum:
        - recurring_vs_variable
        - financial_calendar
        - weekday_heatmap
        - balance_projection
        - quarterly_average_comparison
        - subscription_price_increases
        - income_stability
        - monthly_savings_capacity
        - debt_cost_evolution
        - net_worth_history
        - spending_heatmap
        - subscription_annual_cost
    AdvancedAnalytics:
      type: object
      required:
        - metric
        - generatedAt
        - currency
        - assumptions
        - missingData
        - data
      properties:
        metric:
          $ref: '#/components/schemas/AdvancedAnalyticsMetric'
        generatedAt:
          $ref: '#/components/schemas/DateTime'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency of bare minor-unit fields. Money objects may explicitly identify a native currency instead.
        assumptions:
          type: array
          description: Assumptions or calculation inputs relevant to interpreting the result; empty when none apply.
          items:
            type: string
        missingData:
          type: array
          description: Reasons for incomplete coverage or unavailable values; empty when all relevant inputs are available.
          items:
            type: string
        fxRatesUsed:
          $ref: '#/components/schemas/FxRatesUsed'
          description: Present when the result uses currency conversion.
        data:
          type: object
        explanation:
          type:
            - string
            - 'null'
      additionalProperties: false
      oneOf:
        - $ref: '#/components/schemas/RecurringVsVariableAnalytics'
        - $ref: '#/components/schemas/FinancialCalendarAnalytics'
        - $ref: '#/components/schemas/WeekdayHeatmapAnalytics'
        - $ref: '#/components/schemas/BalanceProjectionAnalytics'
        - $ref: '#/components/schemas/QuarterlyAverageComparisonAnalytics'
        - $ref: '#/components/schemas/SubscriptionPriceIncreasesAnalytics'
        - $ref: '#/components/schemas/IncomeStabilityAnalytics'
        - $ref: '#/components/schemas/MonthlySavingsCapacityAnalytics'
        - $ref: '#/components/schemas/DebtCostEvolutionAnalytics'
        - $ref: '#/components/schemas/NetWorthHistoryAnalytics'
        - $ref: '#/components/schemas/SpendingHeatmapAnalytics'
        - $ref: '#/components/schemas/SubscriptionAnnualCostAnalytics'
      discriminator:
        propertyName: metric
        mapping:
          recurring_vs_variable: '#/components/schemas/RecurringVsVariableAnalytics'
          financial_calendar: '#/components/schemas/FinancialCalendarAnalytics'
          weekday_heatmap: '#/components/schemas/WeekdayHeatmapAnalytics'
          balance_projection: '#/components/schemas/BalanceProjectionAnalytics'
          quarterly_average_comparison: '#/components/schemas/QuarterlyAverageComparisonAnalytics'
          subscription_price_increases: '#/components/schemas/SubscriptionPriceIncreasesAnalytics'
          income_stability: '#/components/schemas/IncomeStabilityAnalytics'
          monthly_savings_capacity: '#/components/schemas/MonthlySavingsCapacityAnalytics'
          debt_cost_evolution: '#/components/schemas/DebtCostEvolutionAnalytics'
          net_worth_history: '#/components/schemas/NetWorthHistoryAnalytics'
          spending_heatmap: '#/components/schemas/SpendingHeatmapAnalytics'
          subscription_annual_cost: '#/components/schemas/SubscriptionAnnualCostAnalytics'
    RecurringVsVariableAnalytics:
      type: object
      properties:
        metric:
          const: recurring_vs_variable
        data:
          type: object
          description: Recurrent expenses come from confirmed recurring rules and detected subscriptions, counted once when linked to a rule. Variable expenses are the rest. The essential category flag and the manual extraordinary transaction flag are separate classifications.
          required:
            - periodStart
            - periodEnd
            - committedMinor
            - variableMinor
            - totalExpensesMinor
            - committedPercent
            - consideredSubscriptionCount
            - unclassifiedSubscriptionCount
          properties:
            periodStart:
              $ref: '#/components/schemas/Date'
            periodEnd:
              $ref: '#/components/schemas/Date'
            committedMinor:
              $ref: '#/components/schemas/AmountMinor'
            variableMinor:
              $ref: '#/components/schemas/AmountMinor'
            totalExpensesMinor:
              $ref: '#/components/schemas/AmountMinor'
            committedPercent:
              type:
                - number
                - 'null'
            consideredSubscriptionCount:
              type: integer
              minimum: 0
            unclassifiedSubscriptionCount:
              type: integer
              minimum: 0
          additionalProperties: false
    FinancialCalendarAnalytics:
      type: object
      properties:
        metric:
          const: financial_calendar
        data:
          type: object
          description: Booked movements and scheduled payments, income, instalments, fund contributions and reminders by date. Expected totals include only scheduled monetary events, not booked transactions or reminders.
          required:
            - periodStart
            - periodEnd
            - days
            - totalExpectedOutflowMinor
            - totalExpectedInflowMinor
            - debtsWithoutScheduledAmount
            - recurringRulesWithUnreadableTemplate
          properties:
            periodStart:
              $ref: '#/components/schemas/Date'
            periodEnd:
              $ref: '#/components/schemas/Date'
            totalExpectedOutflowMinor:
              $ref: '#/components/schemas/AmountMinor'
            totalExpectedInflowMinor:
              $ref: '#/components/schemas/AmountMinor'
            debtsWithoutScheduledAmount:
              type: integer
              minimum: 0
            recurringRulesWithUnreadableTemplate:
              type: integer
              minimum: 0
            days:
              type: array
              items:
                type: object
                required:
                  - date
                  - expectedOutflowMinor
                  - expectedInflowMinor
                  - items
                properties:
                  date:
                    $ref: '#/components/schemas/Date'
                  expectedOutflowMinor:
                    $ref: '#/components/schemas/AmountMinor'
                  expectedInflowMinor:
                    $ref: '#/components/schemas/AmountMinor'
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FinancialCalendarItem'
                additionalProperties: false
          additionalProperties: false
    FinancialCalendarItem:
      type: object
      required:
        - kind
        - refId
        - label
        - state
        - direction
        - amountMinor
      properties:
        kind:
          type: string
          enum:
            - transaction
            - subscription
            - debt_payment
            - recurring_rule
            - income
            - installment
            - fund_contribution
            - reminder
        refId:
          $ref: '#/components/schemas/Uuid'
        label:
          type: string
        state:
          type: string
          enum:
            - actual
            - scheduled
        direction:
          type: string
          enum:
            - inflow
            - outflow
            - none
        amountMinor:
          description: Magnitude of the monetary event, or null for a reminder without an amount.
          anyOf:
            - $ref: '#/components/schemas/AmountMinor'
            - type: 'null'
      additionalProperties: false
    WeekdayHeatmapAnalytics:
      type: object
      properties:
        metric:
          const: weekday_heatmap
        data:
          type: object
          required:
            - series
          properties:
            series:
              type: array
              minItems: 7
              maxItems: 7
              description: Seven UTC weekdays in ISO order (Monday is 1), including zero-activity days.
              items:
                type: object
                required:
                  - weekday
                  - transactionCount
                  - totalMinor
                properties:
                  weekday:
                    type: integer
                    minimum: 1
                    maximum: 7
                  transactionCount:
                    type: integer
                    minimum: 0
                  totalMinor:
                    $ref: '#/components/schemas/AmountMinor'
                additionalProperties: false
          additionalProperties: false
    BalanceProjectionAnalytics:
      type: object
      properties:
        metric:
          const: balance_projection
        data:
          type: object
          required:
            - openingBalanceMinor
            - basisMonths
            - meanMonthlyIncomeMinor
            - meanMonthlyExpensesMinor
            - months
          properties:
            openingBalanceMinor:
              $ref: '#/components/schemas/AmountMinor'
            basisMonths:
              type: integer
              minimum: 0
            meanMonthlyIncomeMinor:
              $ref: '#/components/schemas/AmountMinor'
            meanMonthlyExpensesMinor:
              $ref: '#/components/schemas/AmountMinor'
            months:
              type: array
              items:
                type: object
                required:
                  - month
                  - expectedInflowMinor
                  - expectedOutflowMinor
                  - projectedBalanceMinor
                properties:
                  month:
                    $ref: '#/components/schemas/Date'
                  expectedInflowMinor:
                    $ref: '#/components/schemas/AmountMinor'
                  expectedOutflowMinor:
                    $ref: '#/components/schemas/AmountMinor'
                  projectedBalanceMinor:
                    $ref: '#/components/schemas/AmountMinor'
                additionalProperties: false
          additionalProperties: false
    QuarterlyAverageComparisonAnalytics:
      type: object
      properties:
        metric:
          const: quarterly_average_comparison
        data:
          type: object
          required:
            - series
          properties:
            series:
              type: array
              items:
                type: object
                required:
                  - quarter
                  - monthsCounted
                  - averageMonthlyIncomeMinor
                  - averageMonthlyExpensesMinor
                  - averageMonthlySavingsCapacityMinor
                  - savingsCapacityDeltaPercentVsPreviousQuarter
                properties:
                  quarter:
                    type: string
                    pattern: ^[0-9]{4}-Q[1-4]$
                  monthsCounted:
                    type: integer
                    minimum: 1
                    maximum: 3
                  averageMonthlyIncomeMinor:
                    $ref: '#/components/schemas/AmountMinor'
                  averageMonthlyExpensesMinor:
                    $ref: '#/components/schemas/AmountMinor'
                  averageMonthlySavingsCapacityMinor:
                    $ref: '#/components/schemas/AmountMinor'
                  savingsCapacityDeltaPercentVsPreviousQuarter:
                    type:
                      - number
                      - 'null'
                additionalProperties: false
          additionalProperties: false
    SubscriptionPriceIncreasesAnalytics:
      type: object
      properties:
        metric:
          const: subscription_price_increases
        data:
          type: object
          required:
            - items
            - consideredCount
            - decreasedOrUnchangedCount
            - excludedForCurrencyMismatch
            - excludedForZeroPrevious
          properties:
            items:
              type: array
              items:
                type: object
                required:
                  - subscriptionId
                  - payeeName
                  - previousAmount
                  - currentAmount
                  - increasePercent
                properties:
                  subscriptionId:
                    $ref: '#/components/schemas/Uuid'
                  payeeName:
                    type: string
                  previousAmount:
                    $ref: '#/components/schemas/Money'
                  currentAmount:
                    $ref: '#/components/schemas/Money'
                  increasePercent:
                    type: number
                additionalProperties: false
            consideredCount:
              type: integer
              minimum: 0
            decreasedOrUnchangedCount:
              type: integer
              minimum: 0
            excludedForCurrencyMismatch:
              type: integer
              minimum: 0
            excludedForZeroPrevious:
              type: integer
              minimum: 0
          additionalProperties: false
    IncomeStabilityAnalytics:
      type: object
      properties:
        metric:
          const: income_stability
        data:
          type: object
          required:
            - monthsCounted
            - meanMonthlyIncomeMinor
            - minMonthlyIncomeMinor
            - maxMonthlyIncomeMinor
            - coefficientOfVariationPercent
            - medianMonthlyIncomeMinor
            - trendPercent
            - regularityPercent
            - sourceConcentration
          properties:
            monthsCounted:
              type: integer
              minimum: 0
            meanMonthlyIncomeMinor:
              $ref: '#/components/schemas/AmountMinor'
            minMonthlyIncomeMinor:
              $ref: '#/components/schemas/AmountMinor'
            maxMonthlyIncomeMinor:
              $ref: '#/components/schemas/AmountMinor'
            coefficientOfVariationPercent:
              type:
                - number
                - 'null'
            medianMonthlyIncomeMinor:
              $ref: '#/components/schemas/AmountMinor'
            trendPercent:
              type:
                - number
                - 'null'
              description: Change from first to last counted month, or null when fewer than two months or the first month is zero.
            regularityPercent:
              type:
                - number
                - 'null'
              minimum: 0
              maximum: 100
              description: Percentage of counted months with income, or null if there are no counted months.
            sourceConcentration:
              type: array
              items:
                type: object
                required:
                  - payeeId
                  - amount
                  - sharePercent
                properties:
                  payeeId:
                    type:
                      - string
                      - 'null'
                    format: uuid
                    description: Null groups income without an identified source.
                  amount:
                    $ref: '#/components/schemas/Money'
                  sharePercent:
                    type: number
                    minimum: 0
                    maximum: 100
                additionalProperties: false
          additionalProperties: false
    MonthlySavingsCapacityAnalytics:
      type: object
      properties:
        metric:
          const: monthly_savings_capacity
        data:
          type: object
          required:
            - series
          properties:
            series:
              type: array
              items:
                type: object
                required:
                  - month
                  - incomeMinor
                  - expensesMinor
                  - savingsCapacityMinor
                  - recurringIncomeMinor
                  - essentialExpensesMinor
                  - discretionaryExpensesMinor
                  - obligationsMinor
                  - currentSavingsMinor
                properties:
                  month:
                    $ref: '#/components/schemas/Date'
                  incomeMinor:
                    $ref: '#/components/schemas/AmountMinor'
                  expensesMinor:
                    $ref: '#/components/schemas/AmountMinor'
                  savingsCapacityMinor:
                    $ref: '#/components/schemas/AmountMinor'
                    description: Potential savings for this month.
                  recurringIncomeMinor:
                    $ref: '#/components/schemas/AmountMinor'
                  essentialExpensesMinor:
                    $ref: '#/components/schemas/AmountMinor'
                  discretionaryExpensesMinor:
                    $ref: '#/components/schemas/AmountMinor'
                  obligationsMinor:
                    $ref: '#/components/schemas/AmountMinor'
                  currentSavingsMinor:
                    $ref: '#/components/schemas/AmountMinor'
                additionalProperties: false
          additionalProperties: false
    DebtCostEvolutionAnalytics:
      type: object
      properties:
        metric:
          const: debt_cost_evolution
        data:
          type: object
          required:
            - series
            - totalInterestMinor
