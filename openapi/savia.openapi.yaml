    post:
      operationId: confirmSubscription
      security:
        - bearerAuth: []
      summary: Confirm a detected subscription
      description: A workspace writer can move a subscription from detected to confirmed. The transition creates and links exactly one recurring rule from the detected account, amount and frequency, with reminder-only behavior for future occurrences. This does not book or rewrite any transactions. A successful replay with the same Idempotency-Key returns the original result without creating another rule. Only detected subscriptions may transition; a new command on a resolved subscription returns 409.
