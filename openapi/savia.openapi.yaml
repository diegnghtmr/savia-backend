                    items:
                      $ref: '#/components/schemas/McpGrant'
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
    post:
      operationId: createMcpGrant
      summary: Create restricted MCP grant
      tags:
        - MCP Grants
      responses:
        '201':
          description: MCP grant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The requested grant scopes exceed the minter's role in at least one named workspace. Owners and administrators may grant all nine scopes; editors may grant all except workspace:admin; viewers may grant only *:read scopes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
