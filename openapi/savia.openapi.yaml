    post:
      operationId: withdrawFromFund
      security:
        - bearerAuth: []
        - cliTokenAuth:
            - transactions:write
            - budgets:write
      summary: Withdraw saved money from a sinking fund
      description: An owner, administrator or editor can release saved money to an explicit destination account and must record a reason. The server books the withdrawal at the current time. The amount must not exceed the fund's saved amount at booking time (effective confirmed or reconciled contributions minus withdrawals; future-dated contributions do not count). The balance check, fund debit and ledger credit are atomic, including across competing withdrawals. Rejection changes neither balance. The ledger entry is a confirmed adjustment linked to the fund, with a positive destination-account posting and an equal negative external posting. This reverses the direction of a contribution; it is not income. The destination account's confirmed and available balances increase by the amount from the booking time, with no separate release from a reserve. The reason is stored in the transaction's notes. While authorized, replaying the same Idempotency-Key and request returns the original transaction without another withdrawal.
      tags:
        - Funds
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFundWithdrawalRequest'
            example:
              accountId: c878af78-9cb9-4938-ad55-03427865ac79
              amount:
                amountMinor: '2500'
                currency: USD
              reason: Replace a broken appliance.
      responses:
        '201':
          description: Withdrawal recorded and destination account credited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
              example:
                id: b087d49c-adc0-4d8e-b4f0-2d9ea4016d73
                type: adjustment
                status: confirmed
                accountId: c878af78-9cb9-4938-ad55-03427865ac79
                amount:
                  amountMinor: '2500'
                  currency: USD
                notes: Replace a broken appliance.
                occurredAt: 2026-11-21T12:00:00Z
                createdAt: 2026-11-21T12:00:00Z
                updatedAt: 2026-11-21T12:00:00Z
