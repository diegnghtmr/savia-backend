  /v1/ai/credentials:
    get:
      operationId: listAICredentials
      summary: List masked AI credential metadata
      tags:
        - AI Providers
      responses:
        '200':
          description: Credential metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AICredentialMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
    post:
      operationId: createAICredential
      summary: Register provider-specific credential
      tags:
        - AI Providers
      responses:
        '201':
          description: Credential registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AICredentialMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: The secret is accepted over TLS, validated, encrypted and never returned. Provider policy may disable specific credential types.
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAICredentialRequest'
  /v1/ai/credentials/{credentialId}:
    parameters:
      - name: credentialId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - $ref: '#/components/parameters/WorkspaceIdHeader'
    patch:
      operationId: updateAICredential
      summary: Update, disable or rotate AI credential
      tags:
        - AI Providers
      responses:
        '200':
          description: Credential updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AICredentialMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: Idempotency conflict or an update that violates a uniqueness constraint, such as a duplicate alias.
        '412':
          $ref: '#/components/responses/PreconditionFailed'
          description: If-Match is missing, invalid or stale, the credential ID is invalid, or the credential has been revoked.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          description: Supply the current credential version as one quoted strong ETag. Wildcard and weak ETags are not accepted.
          schema:
            type: string
            examples:
              - '"0"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAICredentialRequest'
    delete:
      operationId: revokeAICredential
      summary: Revoke AI credential
      tags:
        - AI Providers
      responses:
        '204':
          description: Credential revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
