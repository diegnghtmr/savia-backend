openapi: 3.1.1
info:
  title: Savia Backend Executable API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:3000
security:
  - bearerAuth: []
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
tags:
  - name: System
    description: Health and service metadata.
  - name: Profile
    description: Authenticated user profile and preferences.
  - name: Workspaces
    description: Personal and collaborative workspace management.
  - name: Members
    description: Workspace members, roles and invitations.
  - name: Accounts
    description: Financial accounts and balances.
  - name: Transactions
    description: Income, expenses, adjustments and split transactions.
  - name: Transfers
    description: Same-currency and cross-currency transfers.
  - name: Catalogs
    description: Categories, payees and tags.
  - name: Recurring
    description: Recurring rules and detected subscriptions.
  - name: Reconciliations
    description: Statement reconciliation workflows.
  - name: Budgets
    description: Budget methods, allocations and rollover rules.
  - name: Funds
    description: Sinking funds and contributions.
  - name: Debts
    description: Debt balances, payments and projections.
  - name: Currencies
    description: Currencies and exchange rates.
  - name: Analytics
    description: Financial summaries and advanced analytics.
  - name: Forecasts
    description: Balance and category forecasts.
  - name: Scenarios
    description: Non-destructive financial simulations.
  - name: Imports
    description: Statement import workflow.
  - name: Exports
    description: Portable exports and backups.
  - name: Receipts
    description: Receipt upload, OCR and confirmation.
  - name: Reports
    description: Saved report definitions, runs and PDF exports.
  - name: AI Providers
    description: Provider-neutral AI configuration and provider-specific credentials.
  - name: Agent
    description: Agent conversations, streamed responses and tool proposals.
  - name: Approvals
    description: Human approval of sensitive agent or MCP actions.
  - name: CLI Auth
    description: Device authorization for the Savia CLI.
  - name: MCP Grants
    description: Authorization grants for external MCP clients.
  - name: Jobs
    description: Asynchronous job status.
  - name: Notifications
    description: In-app notifications and preferences.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth session JWT. Savia rejects JWTs whose session is no longer active at the provider, even before token expiry. If active session status cannot be verified, Savia does not grant access.
    cliTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: svt_opaque
      description: Savia-issued opaque CLI access token, prefixed svt_, scoped, revocable, expiring and stored as a SHA-256 hash.
    mcpOAuth:
      type: oauth2
      description: Remote MCP uses OAuth 2.1 authorization code flow with S256 PKCE. The authorization server and trusted issuer are the configured Supabase Auth instance; the flow URLs below are placeholders for that instance. For Streamable HTTP, clients request the canonical MCP resource URL advertised in OAuth protected resource metadata. The remote MCP endpoint and the Savia API share that audience. The MCP server forwards the bearer only to the configured same-resource Savia API, never to a different audience. An MCP bearer is a signed access JWT for that audience with a subject and a signed UUID `mcp_grant_id` claim; session JWTs and tokens for other resources do not satisfy this scheme. The grant ID is never taken from request headers or bodies. The same resource token can be used on the proposal API and, as a separate authentication alternative, on operations annotated with `x-savia-mcp-tool` whose `riskClass` is `read`. For each read, Savia checks that the grant is still active, belongs to the token subject, covers all of the operation's `requiredScopes` and permits the tool and requested resources. The grant does not widen the subject's existing permissions. A missing or invalid MCP token, including a missing or malformed grant claim, returns 401. A valid token with an inactive, unowned or insufficient grant returns 403. MCP transport is outside this OpenAPI document. Validation with a local fake authorization server is planned; real Supabase Auth compatibility is unverified.
      flows:
        authorizationCode:
          authorizationUrl: https://project-ref.supabase.co/auth/v1/oauth/authorize
          tokenUrl: https://project-ref.supabase.co/auth/v1/oauth/token
          scopes:
            accounts:read: Read accounts and balances.
            accounts:write: Create and modify accounts.
            transactions:read: Read financial transactions.
            transactions:write: Create and modify financial transactions.
            budgets:read: Read budgets.
            budgets:write: Modify budgets.
            reports:read: Run and read reports.
            reports:write: Create report definitions.
            workspace:admin: Administer workspace integrations.
  parameters:
    WorkspaceIdHeader:
      name: X-Workspace-Id
      in: header
      required: true
      description: Workspace in which the operation is executed.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID used to safely replay this command. The same key cannot be reused with a different normalized request.
      schema:
        type: string
        format: uuid
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Expected ETag for optimistic concurrency. When present and stale, the server returns 412.
      schema:
        type: string
        examples:
          - '"7"'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor returned by a previous page.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    RecurringRuleId:
      name: ruleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    RecurringOccurrenceId:
      name: occurrenceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    AnalyticsPresentationCurrency:
      name: presentationCurrency
      in: query
      description: Reporting currency. Defaults to the workspace base currency.
      schema:
        $ref: '#/components/schemas/CurrencyCode'
    AnalyticsAccountIds:
      name: accountIds
      in: query
      schema:
        $ref: '#/components/schemas/AnalyticsFilterIds'
    AnalyticsCategoryIds:
      name: categoryIds
      in: query
      schema:
        $ref: '#/components/schemas/AnalyticsFilterIds'
    AnalyticsTagIds:
      name: tagIds
      in: query
      schema:
        $ref: '#/components/schemas/AnalyticsFilterIds'
    AnalyticsPayeeIds:
      name: payeeIds
      in: query
      schema:
        $ref: '#/components/schemas/AnalyticsFilterIds'
    AnalyticsMemberIds:
      name: memberIds
      in: query
      description: Workspace member IDs.
      schema:
        $ref: '#/components/schemas/AnalyticsFilterIds'
  headers:
    ETag:
      description: Current resource version.
      schema:
        type: string
        examples:
          - '"7"'
    RetryAfter:
      description: Seconds before the client should retry.
      schema:
        type: integer
        minimum: 0
  responses:
    RecurringOccurrenceResult:
      description: Updated recurring occurrence.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecurringOccurrence'
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: The actor lacks the required workspace role or scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: The resource does not exist or is not visible to the actor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: The request conflicts with the current state, including idempotency conflicts.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: The supplied ETag does not match the current resource version.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity:
      description: The request is structurally valid but violates a business rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: The client exceeded a rate or cost limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    ServiceUnavailable:
      description: A required service or provider is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
  schemas:
    Uuid:
      type: string
      format: uuid
    SaviaScope:
      type: string
      enum:
        - accounts:read
        - accounts:write
        - transactions:read
        - transactions:write
        - budgets:read
        - budgets:write
        - reports:read
        - reports:write
        - workspace:admin
    Date:
      type: string
      format: date
    DateTime:
      type: string
      format: date-time
    OnboardingRequest:
      type: object
      required:
        - email
        - displayName
        - locale
        - countryCode
        - timezone
        - dateFormat
        - weekStartsOn
        - numberFormat
        - defaultCurrency
        - workspaceName
        - baseCurrency
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        locale:
          type: string
          description: BCP 47 language tag supported by the runtime.
          examples:
            - en-US
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 code.
          pattern: ^[A-Za-z]{2}$
        timezone:
          type: string
          description: IANA timezone identifier.
          examples:
            - America/Bogota
        dateFormat:
          type: string
          enum:
            - DD/MM/YYYY
            - MM/DD/YYYY
            - YYYY-MM-DD
        weekStartsOn:
          type: integer
          minimum: 0
          maximum: 6
        numberFormat:
          type: string
          enum:
            - 1,234.56
            - 1.234,56
        defaultCurrency:
          type: string
          description: Active ISO 4217 currency code.
          pattern: ^[A-Za-z]{3}$
        workspaceName:
          type: string
          minLength: 1
          maxLength: 120
        baseCurrency:
          type: string
          description: Active ISO 4217 currency code.
          pattern: ^[A-Za-z]{3}$
        privacyModeEnabled:
          type: boolean
          default: false
      additionalProperties: false
    OnboardingAggregate:
      type: object
      required:
        - profileId
        - workspaceId
      properties:
        profileId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
      additionalProperties: false
    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
      description: Must be an active ISO 4217 currency code; the server answers 422 otherwise.
      examples:
        - COP
        - USD
        - EUR
    AmountMinor:
      type: string
      pattern: ^-?[0-9]+$
      description: Signed integer minor-unit amount serialized as a string to avoid JavaScript precision loss.
      examples:
        - '125000'
        - '-5000'
    DecimalString:
      type: string
      pattern: ^-?[0-9]+(?:\.[0-9]+)?$
      examples:
        - '4123.450000000000000000'
    Money:
      type: object
      required:
        - amountMinor
        - currency
      properties:
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      additionalProperties: false
    ConvertedMoney:
      type: object
      required:
        - original
        - converted
        - rate
        - rateDate
        - rateSource
      properties:
        original:
          $ref: '#/components/schemas/Money'
        converted:
          $ref: '#/components/schemas/Money'
        rate:
          $ref: '#/components/schemas/DecimalString'
        rateDate:
          $ref: '#/components/schemas/Date'
        rateSource:
          type: string
      additionalProperties: false
    FxRatesUsed:
      type: array
      description: Distinct exchange rates actually applied to cross-currency amounts in the result, not merely rates available to the workspace. An ordered currency pair can appear more than once if different rates or freshness states were used for different valuations. Same-currency amounts and missing rates are not entries.
      minItems: 1
      uniqueItems: true
      items:
        $ref: '#/components/schemas/FxRateUsed'
    FxRateUsed:
      type: object
      required:
        - baseCurrency
        - quoteCurrency
        - rate
        - rateDate
        - source
        - freshness
      properties:
        baseCurrency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency of the amount before conversion.
        quoteCurrency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency of the converted amount.
        rate:
          $ref: '#/components/schemas/DecimalString'
          description: Applied base-to-quote conversion rate.
        rateDate:
          $ref: '#/components/schemas/Date'
          description: UTC effective date of the applied rate.
        source:
          type: string
          description: Source of the applied rate, such as manual or frankfurter.
        freshness:
          type: string
          enum:
            - fresh
            - stale
            - unknown
          description: Freshness at the valuation instant used for rate selection, not the time the result is read. Manual rates do not expire. Frankfurter rates reach the stale threshold at 72 hours. Use unknown when freshness cannot be established for an applied rate. This field does not change which rates may be used.
      additionalProperties: false
    PageInfo:
      type: object
      required:
        - hasNextPage
      properties:
        nextCursor:
          type:
            - string
            - 'null'
        hasNextPage:
          type: boolean
      additionalProperties: false
    FieldViolation:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      additionalProperties: false
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
          default: []
        retryable:
          type: boolean
          default: false
      additionalProperties: true
    UserSession:
      type: object
      required:
        - id
        - createdAt
        - lastActiveAt
        - current
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        lastActiveAt:
          $ref: '#/components/schemas/DateTime'
        userAgent:
          type: string
        current:
          type: boolean
      additionalProperties: false
    DashboardCards:
      type: array
      description: Cards in display order. Each card ID may appear at most once, regardless of visibility.
      uniqueItems: true
      items:
        type: object
        required:
          - id
          - visible
        properties:
          id:
            type: string
            enum:
              - net_worth
              - assets
              - debts
              - income
              - expenses
              - savings_capacity
              - budget_utilization
              - account_balances
              - upcoming_operations
              - alerts
              - reconciliation_status
          visible:
            type: boolean
        additionalProperties: false
    DashboardPeriod:
      oneOf:
        - type: object
          description: Calendar period in the workspace time zone.
          required:
            - preset
          properties:
            preset:
              type: string
              enum:
                - this_month
                - this_quarter
                - this_year
          additionalProperties: false
        - type: object
          description: Inclusive workspace-local date range. The start must be on or before the end.
          required:
            - preset
            - from
            - to
          properties:
            preset:
              const: custom
            from:
              $ref: '#/components/schemas/Date'
            to:
              $ref: '#/components/schemas/Date'
          additionalProperties: false
    DashboardPreferences:
      type: object
      required:
        - cards
        - period
        - presentationCurrency
        - version
      properties:
        cards:
          $ref: '#/components/schemas/DashboardCards'
        period:
          $ref: '#/components/schemas/DashboardPeriod'
        presentationCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        version:
          type: integer
          minimum: 1
          readOnly: true
      additionalProperties: false
    UpdateDashboardPreferencesRequest:
      type: object
      required:
        - cards
        - period
        - presentationCurrency
      properties:
        cards:
          $ref: '#/components/schemas/DashboardCards'
        period:
          $ref: '#/components/schemas/DashboardPeriod'
        presentationCurrency:
          $ref: '#/components/schemas/CurrencyCode'
      additionalProperties: false
    UserProfile:
      type: object
      required:
        - id
        - email
        - displayName
        - locale
        - timezone
        - defaultCurrency
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        locale:
          type: string
          examples:
            - es-CO
        timezone:
          type: string
          examples:
            - America/Bogota
        defaultCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        privacyModeEnabled:
          type: boolean
      additionalProperties: false
    UpdateUserProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        locale:
          type: string
        timezone:
          type: string
        defaultCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        privacyModeEnabled:
          type: boolean
      additionalProperties: false
      minProperties: 1
    WorkspaceRole:
      type: string
      enum:
        - owner
        - administrator
        - editor
        - viewer
    Workspace:
      type: object
      required:
        - id
        - name
        - kind
        - baseCurrency
        - role
        - createdAt
        - version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          type: string
          enum:
            - personal
            - family
            - shared
        baseCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        version:
          type: integer
          minimum: 1
      additionalProperties: false
    CreateWorkspaceRequest:
      type: object
      required:
        - name
        - baseCurrency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          type: string
          enum:
            - family
            - shared
          default: family
        baseCurrency:
          $ref: '#/components/schemas/CurrencyCode'
      additionalProperties: false
    UpdateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        baseCurrency:
          $ref: '#/components/schemas/CurrencyCode'
      additionalProperties: false
      minProperties: 1
    WorkspaceMember:
      type: object
      required:
        - id
        - userId
        - displayName
        - role
        - status
        - joinedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        userId:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        status:
          type: string
          enum:
            - active
            - suspended
        joinedAt:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: false
    UpdateWorkspaceMemberRequest:
      type: object
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/WorkspaceRole'
      additionalProperties: false
    WorkspaceInvitation:
      type: object
      required:
        - id
        - email
        - role
        - status
        - expiresAt
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
        expiresAt:
          $ref: '#/components/schemas/DateTime'
        createdAt:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: false
    CreateWorkspaceInvitationRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/WorkspaceRole'
      additionalProperties: false
    AccountType:
      type: string
      enum:
        - cash
        - savings
        - checking
        - digital_wallet
        - credit_card
        - loan
        - investment_manual
        - receivable
        - generic
        - informal_debt
    InformalDebtDetails:
      type: object
      description: Optional details for an informal_debt account. Direction is relative to the workspace, not the signed ledger amount.
      required:
        - counterpartyName
        - direction
      properties:
        counterpartyName:
          type: string
          minLength: 1
          maxLength: 120
          examples:
            - Example lender
        direction:
          type: string
          description: i_owe means the workspace owes the counterparty; owed_to_me means the counterparty owes the workspace.
          enum:
            - i_owe
            - owed_to_me
      additionalProperties: false
    AccountStatus:
      type: string
      enum:
        - active
        - archived
        - closed
    Account:
      type: object
      required:
        - id
        - name
        - type
        - currency
        - status
        - includeInNetWorth
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        status:
          $ref: '#/components/schemas/AccountStatus'
        institution:
          type:
            - string
            - 'null'
          maxLength: 120
        maskedNumber:
          type:
            - string
            - 'null'
          maxLength: 32
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        colorToken:
          type:
            - string
            - 'null'
        icon:
          type:
            - string
            - 'null'
        includeInNetWorth:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
        version:
          type: integer
          minimum: 1
        informalDebt:
          $ref: '#/components/schemas/InformalDebtDetails'
          description: Present only for informal_debt accounts with stored details.
      additionalProperties: false
    AccountBalance:
      type: object
      required:
        - accountId
        - nativeBalance
        - baseCurrencyEquivalent
        - asOf
      properties:
        accountId:
          $ref: '#/components/schemas/Uuid'
        nativeBalance:
          $ref: '#/components/schemas/Money'
        pendingBalance:
          $ref: '#/components/schemas/Money'
        availableBalance:
          $ref: '#/components/schemas/Money'
          description: Spendable ledger balance in the account's native currency as of asOf. It equals nativeBalance (confirmed and reconciled postings) minus the sum of the absolute amounts of negative pending postings on the account at or before asOf. Pending inflows do not increase it. Fund contributions already booked as outflows are already reflected in the ledger and are not deducted again. The result may be negative and does not represent a credit limit.
          examples:
            - amountMinor: '8500'
              currency: USD
        reconciledBalance:
          $ref: '#/components/schemas/Money'
        baseCurrencyEquivalent:
          $ref: '#/components/schemas/ConvertedMoney'
        asOf:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: false
    CreateAccountRequest:
      type: object
      required:
        - name
        - type
        - currency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        openingBalance:
          $ref: '#/components/schemas/Money'
        openingBalanceDate:
          $ref: '#/components/schemas/Date'
        institution:
          type: string
          maxLength: 120
        maskedNumber:
          type: string
          maxLength: 32
        description:
          type: string
          maxLength: 500
        includeInNetWorth:
          type: boolean
