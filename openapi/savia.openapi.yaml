      summary: Update a sinking fund's metadata
      description: An owner, administrator or editor can edit fund metadata without changing the currency, saved amount, status or ledger. Omitted fields are unchanged. While authorized, replaying the same fund ID, body and If-Match with the same Idempotency-Key returns the original response and ETag without reapplying the edit. A new request with a stale If-Match returns 412 and changes nothing.
