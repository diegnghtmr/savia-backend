        - dayOfWeek
        - startTime
        - endTime
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO weekday, Monday (1) through Sunday (7).
        startTime:
          type: string
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
          description: Local start time in HH:mm.
        endTime:
          type: string
          pattern: ^(?:(?:[01][0-9]|2[0-3]):[0-5][0-9]|24:00)$
          description: Local end time in HH:mm, strictly after startTime. Use 24:00 for end of day.
      additionalProperties: false
    McpGrant:
      type: object
      description: Deny by default. The grant must be active and unexpired, and current workspace permissions, scopes, workspace and account restrictions, tool eligibility, schedule and any amount limit must all authorize the operation.
      required:
        - id
        - clientName
        - scopes
        - toolAllowlist
        - schedule
        - status
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        clientName:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/SaviaScope'
        workspaceIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        accountIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        toolAllowlist:
          $ref: '#/components/schemas/McpToolAllowlist'
        schedule:
          $ref: '#/components/schemas/McpGrantSchedule'
        maxWriteAmount:
          description: When set, deny writes with amounts over the limit or in a currency other than the limit currency. Do not convert amounts to apply the limit.
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        status:
          type: string
          enum:
            - active
            - revoked
            - expired
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: false
    CreateMcpGrantRequest:
      type: object
      required:
        - clientName
        - scopes
        - workspaceIds
      properties:
        clientName:
          type: string
          minLength: 1
          maxLength: 120
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/SaviaScope'
          minItems: 1
          uniqueItems: true
        workspaceIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
          minItems: 1
          uniqueItems: true
        accountIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
          uniqueItems: true
        toolAllowlist:
          $ref: '#/components/schemas/McpToolAllowlist'
          default: []
          description: Omission is equivalent to an empty (read-only) allowlist.
        schedule:
          $ref: '#/components/schemas/McpGrantSchedule'
          default: []
          description: Omission is equivalent to an empty schedule and permits no calls.
        maxWriteAmount:
          description: When set, deny writes with amounts over the limit or in a currency other than the limit currency. Do not convert amounts to apply the limit.
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    CliDeviceAuthorizationRequest:
      type: object
      required:
        - clientId
      properties:
        clientId:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/SaviaScope'
          uniqueItems: true
      additionalProperties: false
    CliDeviceApprovalRequest:
      type: object
      required:
        - userCode
      properties:
        userCode:
          type: string
          maxLength: 16
          description: Device user code. Case, hyphens and whitespace are ignored; it normalizes to 8 characters from ABCDEFGHJKLMNPQRSTUVWXYZ23456789.
      additionalProperties: false
    CliDeviceAuthorization:
      type: object
      required:
        - deviceCode
        - userCode
        - verificationUri
        - expiresIn
        - interval
      properties:
        deviceCode:
          type: string
        userCode:
          type: string
        verificationUri:
          type: string
          format: uri
        verificationUriComplete:
          type: string
          format: uri
        expiresIn:
          type: integer
          minimum: 1
        interval:
          type: integer
          minimum: 1
      additionalProperties: false
    CliDeviceTokenRequest:
      type: object
      required:
        - clientId
        - deviceCode
      properties:
        clientId:
          type: string
        deviceCode:
          type: string
      additionalProperties: false
    CliDeviceTokenResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - scope
      properties:
        accessToken:
          type: string
          pattern: ^svt_[A-Za-z0-9_-]{43}$
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: 30 days (2592000 seconds) from issuance, independent of the 10-minute device-code lifetime; no refresh token is issued.
        scope:
          type: string
      additionalProperties: false
    Job:
      type: object
      required:
        - id
        - type
        - status
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
        status:
          type: string
          enum:
            - queued
            - processing
            - completed
            - failed
            - cancelled
            - dead_letter
        progressPercent:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 100
        resultResourceId:
          type:
            - string
            - 'null'
          format: uuid
        error:
          anyOf:
            - $ref: '#/components/schemas/ProblemDetails'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
      additionalProperties: false
    NotificationPreferences:
      type: object
      required:
        - channels
        - quietHours
        - digestEnabled
      properties:
        channels:
          type: object
          required:
            - in_app
            - push
            - email
          properties:
            in_app:
              type: boolean
              description: Controls new in-app delivery without removing notifications already in the inbox.
            push:
              type: boolean
              description: Controls event push delivery to registered devices.
            email:
              type: boolean
              description: Controls event email delivery independently of the weekly digest.
          additionalProperties: false
        quietHours:
          description: Defers external deliveries, including the digest, without delaying in-app notifications. Use null to disable.
          anyOf:
            - $ref: '#/components/schemas/NotificationQuietHours'
            - type: 'null'
        digestEnabled:
          type: boolean
          description: Enables an email digest on Mondays for the previous local calendar week when there are notifications to summarize. The schedule uses the profile timezone (UTC if unavailable); quiet hours may defer delivery.
      additionalProperties: false
    NotificationQuietHours:
      type: object
      description: Daily interval with an inclusive start and exclusive end. A start later than the end spans midnight. Equal times are invalid.
      required:
        - start
        - end
        - timezone
      properties:
        start:
          $ref: '#/components/schemas/NotificationLocalTime'
        end:
          $ref: '#/components/schemas/NotificationLocalTime'
        timezone:
          type: string
          minLength: 1
          description: IANA timezone identifier used for both local times. Unknown identifiers and fixed numeric offsets are not accepted.
          examples:
            - America/Bogota
            - UTC
      additionalProperties: false
    NotificationLocalTime:
      type: string
      description: Local wall-clock time in 24-hour HH:mm notation, with no offset or seconds.
      pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
      examples:
        - '22:00'
        - '07:30'
    RegisterPushDeviceRequest:
      type: object
      required:
        - expoPushToken
        - platform
        - appVersion
      properties:
        expoPushToken:
          type: string
          description: Opaque Expo push token. Native APNs and FCM tokens are not accepted.
          pattern: ^(?:ExpoPushToken|ExponentPushToken)\[[A-Za-z0-9_-]+\]$
          maxLength: 255
          writeOnly: true
        platform:
          type: string
          enum:
            - ios
            - android
        appVersion:
          type: string
          description: Version of the installed app reported by the client.
          minLength: 1
          maxLength: 64
          examples:
            - 1.0.0
      additionalProperties: false
    PushDeviceRegistration:
      type: object
      required:
        - deviceId
      properties:
        deviceId:
          $ref: '#/components/schemas/Uuid'
      additionalProperties: false
    Notification:
      type: object
      required:
        - id
        - type
        - title
        - read
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
        title:
          type: string
        body:
          type:
            - string
            - 'null'
        read:
          type: boolean
        actionUrl:
          type:
            - string
            - 'null'
        createdAt:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: false
paths:
  /health:
    get:
      operationId: getHealth
      summary: Get service health
      tags:
        - System
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - time
                properties:
                  status:
                    type: string
                    const: ok
                  time:
                    $ref: '#/components/schemas/DateTime'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
  /v1/onboarding:
    post:
      operationId: createOnboarding
      summary: Bootstrap the authenticated subject's profile and personal workspace
      description: Creates the onboarding aggregate for the subject carried by the bearer token. The subject is never read from the request body. Replaying the identical request returns the existing aggregate instead of creating a second one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: An identical onboarding request was already applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingAggregate'
        '201':
          description: The onboarding aggregate was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingAggregate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me:
    get:
      operationId: getCurrentUser
      security:
        - bearerAuth: []
        - cliTokenAuth: []
      summary: Get current user profile
      tags:
        - Profile
      responses:
        '200':
          description: Current profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCurrentUser
      summary: Update current user profile
      tags:
        - Profile
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
  /v1/me/sessions:
    get:
      operationId: listMySessions
      security:
        - bearerAuth: []
      summary: List the current user's active sessions
      description: Returns only active sessions owned by the authenticated subject, including whether each is the current session. The list is read-only and never returns access or refresh tokens.
      tags:
        - Profile
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Active session page.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - pageInfo
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserSession'
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      security:
        - bearerAuth: []
      summary: Close the current user's other sessions
      description: Revokes all other active sessions of the authenticated subject and leaves the current session active. This operation is idempotent; it returns 204 even if there are no other sessions. To close all sessions, including the current one, clients use Supabase Auth global sign-out. Savia does not offer per-session revocation.
      tags:
        - Profile
      responses:
        '204':
          description: No other sessions remain active.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me/dashboard-preferences:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdHeader'
    get:
      operationId: getDashboardPreferences
      security:
        - bearerAuth: []
      summary: Get the current user's dashboard preferences for a workspace
      description: Returns effective preferences with a version and ETag even if the user has not saved preferences yet.
      tags:
        - Profile
      responses:
        '200':
          description: Effective dashboard preferences for the authenticated subject and selected workspace.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateDashboardPreferences
      security:
        - bearerAuth: []
      summary: Replace the current user's dashboard preferences for a workspace
      description: Replaces the authenticated subject's preferences only for the selected workspace. An authorized replay with the same Idempotency-Key, If-Match and request returns the original result. A new request with a missing, invalid or stale If-Match is rejected without saving changes.
      tags:
        - Profile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: true
          description: Supply one strong ETag from the dashboard preferences response.
          schema:
            type: string
            examples:
              - '"7"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDashboardPreferencesRequest'
      responses:
        '200':
          description: Updated dashboard preferences.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
          description: If-Match is missing, invalid or does not match the current ETag.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
          description: Invalid preferences, including duplicate card IDs, invalid date range or unsupported currency.
  /v1/me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      security:
        - bearerAuth: []
      summary: Get current user's notification preferences
      description: Returns the effective preferences for the authenticated subject across all event types and workspaces. If no preferences have been saved, all channels and the Monday digest are enabled and quiet hours are disabled.
      tags:
        - Notifications
      responses:
        '200':
          description: Effective notification preferences, including a version for the defaults if no preferences have been saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateNotificationPreferences
      security:
        - bearerAuth: []
      summary: Replace current user's notification preferences
      description: Replaces the authenticated subject's full preferences across all event types and workspaces. When supplied, If-Match must match the current effective preferences, including when they are defaults.
      tags:
        - Notifications
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: Updated notification preferences.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: The timezone is not a recognized IANA identifier or quiet hours start and end at the same time.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me/push-devices:
    post:
      operationId: registerPushDevice
      security:
        - bearerAuth: []
      summary: Register an Expo push device for the current user
      description: Registers the token for the authenticated subject. Registering the same token again for that subject updates the platform and app version in place and returns the same device ID. A token cannot be registered to multiple subjects; remove the existing registration before switching accounts.
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushDeviceRequest'
      responses:
        '200':
          description: Existing registration for this subject.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushDeviceRegistration'
        '201':
          description: Push device registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushDeviceRegistration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The token is already registered to another subject. No registration details are returned.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me/push-devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    delete:
      operationId: unregisterPushDevice
      security:
        - bearerAuth: []
      summary: Remove a push device registration for the current user
      description: Removes only registrations owned by the authenticated subject. Missing and other users' devices both return 404.
      tags:
        - Notifications
      responses:
        '204':
          description: Push device registration removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      security:
        - bearerAuth: []
        - cliTokenAuth: []
        - mcpOAuth: []
      summary: List accessible workspaces
      tags:
        - Workspaces
      responses:
        '200':
          description: Workspace page.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - pageInfo
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      x-savia-mcp-tool:
        name: list_workspaces
        riskClass: read
        requiresApproval: false
        requiredScopes: []
    post:
      operationId: createWorkspace
      summary: Create a collaborative workspace
      tags:
        - Workspaces
      responses:
        '201':
          description: Workspace created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
  /v1/workspaces/{workspaceId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      operationId: getWorkspace
      security:
        - bearerAuth: []
        - cliTokenAuth: []
      summary: Get workspace
      tags:
        - Workspaces
      responses:
        '200':
          description: Workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateWorkspace
      security:
        - bearerAuth: []
        - cliTokenAuth:
            - workspace:admin
      summary: Update workspace
      tags:
        - Workspaces
      responses:
        '200':
          description: Workspace updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
    delete:
      operationId: deleteWorkspace
      summary: Delete an eligible workspace
      tags:
        - Workspaces
      responses:
        '204':
          description: Workspace deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: Only owners may delete a non-personal workspace after all deletion preconditions are satisfied.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
  /v1/workspaces/{workspaceId}/members:
    parameters:
      - name: workspaceId
        in: path
        required: true
