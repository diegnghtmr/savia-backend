      description: Simulates payments starting from the selected debt's current outstanding balance and scheduled terms. It uses the recorded payment frequency (monthly if not set) and holds variable rates at their current value. Minimum payment uses only scheduled minimums. Custom extra applies an extra monthly payment to the selected debt. Snowball and avalanche pay scheduled minimums on active debts in the same workspace and currency, then put any extra monthly budget and freed minimum payments toward the smallest remaining balance or highest annual rate respectively. Results include only the selected debt. Compare strategies for that debt to see the difference in cost and payoff date. This operation does not record or schedule actual payments.
      tags:
