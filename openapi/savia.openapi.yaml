        - Recurring
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Confirmed subscription with its new ETag and recurring rule ID.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
              examples:
                confirmed:
                  value:
                    id: d8f08356-45ac-47b8-8120-09e513e4be72
                    payeeName: Stream Service
                    currentAmount:
                      amountMinor: '1399'
                      currency: USD
                    frequency: monthly
                    status: confirmed
                    etag: '"2"'
                    recurringRuleId: b7b236ed-f742-4d02-b2bc-d1b068c95479
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
