    post:
      operationId: discardSubscription
      security:
        - bearerAuth: []
      summary: Discard a detected subscription
      description: A workspace writer can move a subscription from detected to discarded, represented by the existing ignored status. No recurring rule is created, and detection does not reopen the discarded candidate. A successful replay with the same Idempotency-Key returns the original result. Only detected subscriptions may transition; a new command on a resolved subscription returns 409.
