                    strategy: minimum_payment
                    asOf: 2026-11-21
                    startingBalance:
                      amountMinor: '10000'
                      currency: USD
                    totalInterest:
                      amountMinor: '0'
                      currency: USD
                    totalCost:
                      amountMinor: '10000'
                      currency: USD
