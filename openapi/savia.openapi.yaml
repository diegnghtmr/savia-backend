openapi: 3.1.1
info:
  title: Savia Backend Executable API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:3000
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT verified against the configured issuer, audience, and JWKS.
  schemas:
    OnboardingRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - displayName
        - locale
        - countryCode
        - timezone
        - dateFormat
        - weekStartsOn
        - numberFormat
        - defaultCurrency
        - workspaceName
        - baseCurrency
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        locale:
          type: string
          description: BCP 47 language tag supported by the runtime.
          examples: [en-US]
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 code.
          pattern: '^[A-Za-z]{2}$'
        timezone:
          type: string
          description: IANA timezone identifier.
          examples: [America/Bogota]
        dateFormat:
          type: string
          enum: [DD/MM/YYYY, MM/DD/YYYY, YYYY-MM-DD]
        weekStartsOn:
          type: integer
          minimum: 0
          maximum: 6
        numberFormat:
          type: string
          enum: ['1,234.56', '1.234,56']
        defaultCurrency:
          type: string
          description: Active ISO 4217 currency code.
          pattern: '^[A-Za-z]{3}$'
        workspaceName:
          type: string
          minLength: 1
          maxLength: 120
        baseCurrency:
          type: string
          description: Active ISO 4217 currency code.
          pattern: '^[A-Za-z]{3}$'
        privacyModeEnabled:
          type: boolean
          default: false
    OnboardingAggregate:
      type: object
      additionalProperties: false
      required: [profileId, workspaceId]
      properties:
        profileId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
    ProblemDetails:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, instance]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        instance:
          type: string
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [violations]
          properties:
            violations:
              type: array
              description: Client-actionable field failures, sorted by field then message.
              items:
                type: object
                additionalProperties: false
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
# `paths` stays the final block: the OpenAPI authority suite proves the verifier
# rejects undocumented operations by appending a path to the end of this file.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Read service health
      security: []
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, time]
                properties:
                  status:
                    const: ok
                  time:
                    type: string
                    format: date-time
        '503':
          description: Reserved for an actual unavailable state; this service does not simulate it.
  /v1/onboarding:
    post:
      operationId: createOnboarding
      summary: Bootstrap the authenticated subject's profile and personal workspace
      description: >-
        Creates the onboarding aggregate for the subject carried by the bearer
        token. The subject is never read from the request body. Replaying the
        identical request returns the existing aggregate instead of creating a
        second one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: An identical onboarding request was already applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingAggregate'
        '201':
          description: The onboarding aggregate was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingAggregate'
        '400':
          description: The request body failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: The bearer token is missing or unusable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Onboarding already exists for this subject with different data.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: >-
            An internal failure the client cannot act on. The cause is recorded
            server side and deliberately absent from this body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: >-
            The transaction outcome is unknown. The request is idempotent per
            subject, so it is safe to retry after the indicated delay.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              required: true
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
