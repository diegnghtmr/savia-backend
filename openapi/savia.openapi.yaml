openapi: 3.1.1
info:
  title: Savia Backend Executable API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:3000
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT verified against the configured issuer, audience, and JWKS.
  schemas:
    OnboardingRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - displayName
        - locale
        - countryCode
        - timezone
        - dateFormat
        - weekStartsOn
        - numberFormat
        - defaultCurrency
        - workspaceName
        - baseCurrency
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        locale:
          type: string
          description: BCP 47 language tag supported by the runtime.
          examples: [en-US]
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 code.
          pattern: '^[A-Za-z]{2}$'
        timezone:
          type: string
          description: IANA timezone identifier.
          examples: [America/Bogota]
        dateFormat:
          type: string
          enum: [DD/MM/YYYY, MM/DD/YYYY, YYYY-MM-DD]
        weekStartsOn:
          type: integer
          minimum: 0
          maximum: 6
        numberFormat:
          type: string
          enum: ['1,234.56', '1.234,56']
        defaultCurrency:
          type: string
          description: Active ISO 4217 currency code.
          pattern: '^[A-Za-z]{3}$'
        workspaceName:
          type: string
          minLength: 1
          maxLength: 120
        baseCurrency:
          type: string
          description: Active ISO 4217 currency code.
          pattern: '^[A-Za-z]{3}$'
        privacyModeEnabled:
          type: boolean
          default: false
    OnboardingAggregate:
      type: object
      additionalProperties: false
      required: [profileId, workspaceId]
      properties:
        profileId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
    FieldViolation:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      additionalProperties: false
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'
          default: []
        retryable:
          type: boolean
          default: false
      additionalProperties: true
    UpdateUserProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        locale:
          type: string
          description: BCP 47 language tag supported by the runtime.
          examples: [en-US]
        timezone:
          type: string
          description: IANA timezone identifier.
          examples: [America/Bogota]
        defaultCurrency:
          type: string
          description: Active ISO 4217 currency code.
          pattern: '^[A-Za-z]{3}$'
        privacyModeEnabled:
          type: boolean
    UserProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - locale
        - timezone
        - defaultCurrency
        - privacyModeEnabled
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        locale:
          type: string
        timezone:
          type: string
        defaultCurrency:
          type: string
          pattern: '^[A-Za-z]{3}$'
        privacyModeEnabled:
          type: boolean
    Workspace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - baseCurrency
        - role
        - createdAt
        - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          type: string
          enum: [personal, family, shared]
        baseCurrency:
          type: string
          pattern: '^[A-Za-z]{3}$'
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    WorkspaceMember:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - displayName
        - role
        - status
        - joinedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
        status:
          type: string
          enum: [active, suspended]
        joinedAt:
          type: string
          format: date-time
    UpdateWorkspaceMemberRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
    CreateWorkspaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - baseCurrency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          type: string
          enum: [family, shared]
          default: family
        baseCurrency:
          type: string
          description: Active ISO 4217 currency code.
          pattern: '^[A-Za-z]{3}$'
    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        baseCurrency:
          type: string
          description: Active ISO 4217 currency code.
          pattern: '^[A-Za-z]{3}$'
    PageInfo:
      type: object
      additionalProperties: false
      required:
        - hasNextPage
      properties:
        nextCursor:
          type:
            - string
            - 'null'
        hasNextPage:
          type: boolean
    WorkspaceInvitation:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - role
        - status
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateWorkspaceInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
    AccountType:
      type: string
      enum:
        - cash
        - savings
        - checking
        - digital_wallet
        - credit_card
        - loan
        - investment_manual
        - receivable
        - generic
    AccountStatus:
      type: string
      enum: [active, archived, closed]
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
    Account:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - type
        - currency
        - status
        - includeInNetWorth
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        status:
          $ref: '#/components/schemas/AccountStatus'
        institution:
          type:
            - string
            - 'null'
          maxLength: 120
        maskedNumber:
          type:
            - string
            - 'null'
          maxLength: 32
        description:
          type:
            - string
            - 'null'
          maxLength: 500
        colorToken:
          type:
            - string
            - 'null'
        icon:
          type:
            - string
            - 'null'
        includeInNetWorth:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    Date:
      type: string
      format: date
    AmountMinor:
      type: string
      pattern: '^-?[0-9]+$'
      description: Signed integer minor-unit amount serialized as a string to avoid JavaScript precision loss.
      examples:
        - '125000'
        - '-5000'
    Money:
      type: object
      required:
        - amountMinor
        - currency
      properties:
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      additionalProperties: false
    CreateAccountRequest:
      type: object
      required:
        - name
        - type
        - currency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: '#/components/schemas/AccountType'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        openingBalance:
          $ref: '#/components/schemas/Money'
        openingBalanceDate:
          $ref: '#/components/schemas/Date'
        institution:
          type: string
          maxLength: 120
        maskedNumber:
          type: string
          maxLength: 32
        description:
          type: string
          maxLength: 500
        includeInNetWorth:
          type: boolean
          default: true
      additionalProperties: false
# `paths` stays the final block: the OpenAPI authority suite proves the verifier
# rejects undocumented operations by appending a path to the end of this file.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Read service health
      security: []
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, time]
                properties:
                  status:
                    const: ok
                  time:
                    type: string
                    format: date-time
        '503':
          description: Reserved for an actual unavailable state; this service does not simulate it.
  /v1/onboarding:
    post:
      operationId: createOnboarding
      summary: Bootstrap the authenticated subject's profile and personal workspace
      description: >-
        Creates the onboarding aggregate for the subject carried by the bearer
        token. The subject is never read from the request body. Replaying the
        identical request returns the existing aggregate instead of creating a
        second one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: An identical onboarding request was already applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingAggregate'
        '201':
          description: The onboarding aggregate was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingAggregate'
        '400':
          description: The request body failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: The bearer token is missing or unusable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Onboarding already exists for this subject with different data.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: >-
            An internal failure the client cannot act on. The cause is recorded
            server side and deliberately absent from this body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: >-
            The transaction outcome is unknown. The request is idempotent per
            subject, so it is safe to retry after the indicated delay.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              required: true
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/me:
    get:
      operationId: getCurrentUser
      tags:
        - Profile
      summary: Read the authenticated user profile
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: The bearer token is missing or unusable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Profile not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: >-
            An internal failure the client cannot act on. The cause is recorded
            server side and deliberately absent from this body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      operationId: updateCurrentUser
      tags:
        - Profile
      summary: Update the authenticated user profile
      parameters:
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: Authenticated user profile
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: The request body failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: The bearer token is missing or unusable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Profile not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: Precondition failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: >-
            An internal failure the client cannot act on. The cause is recorded
            server side and deliberately absent from this body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: >-
            The transaction outcome is unknown. The request is idempotent per
            subject, so it is safe to retry after the indicated delay.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              required: true
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      tags:
        - Workspaces
      summary: Read workspace by identifier
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workspace details
          headers:
            ETag:
              description: Quoted decimal workspace version
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: The workspace identifier is not a valid UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: The bearer token is missing or unusable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Workspace access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Workspace not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: >-
            An internal failure the client cannot act on. The cause is recorded
            server side and deliberately absent from this body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      operationId: updateWorkspace
      tags:
        - Workspaces
      summary: Update workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: Workspace updated.
          headers:
            ETag:
              description: Quoted decimal workspace version
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: The workspace identifier is not a valid UUID.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: The bearer token is missing or unusable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Workspace access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Workspace not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: Precondition failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: >-
            An internal failure the client cannot act on. The cause is recorded
            server side and deliberately absent from this body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: >-
            The transaction outcome is unknown. The request is idempotent per
            subject, so it is safe to retry after the indicated delay.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              required: true
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteWorkspace
      tags:
        - Workspaces
      summary: Delete an eligible workspace
      description: >-
        Only owners may delete a non-personal workspace after all deletion
        preconditions are satisfied.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 255
      responses:
        '204':
          description: Workspace deleted.
        '400':
          description: The request header or path parameter failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: The bearer token is missing or unusable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Workspace access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Workspace not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Workspace deletion conflict or idempotency key reused with different payload.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: >-
            An internal failure the client cannot act on. The cause is recorded
            server side and deliberately absent from this body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: >-
            The transaction outcome is unknown. The request is idempotent per
            subject, so it is safe to retry after the indicated delay.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              required: true
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/workspaces:
    post:
      operationId: createWorkspace
      tags:
        - Workspaces
      summary: Create a collaborative workspace
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace created.
          headers:
            ETag:
              description: Quoted decimal workspace version
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          description: The request header or body failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: The bearer token is missing or unusable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Workspace creation conflict or idempotency key reused with different payload.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: >-
            An internal failure the client cannot act on. The cause is recorded
            server side and deliberately absent from this body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: >-
            The transaction outcome is unknown. The request is idempotent per
            subject, so it is safe to retry after the indicated delay.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              required: true
              schema:
                type: integer
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      operationId: listWorkspaces
      tags:
        - Workspaces
      summary: List workspaces for the authenticated user
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Paginated list of workspaces
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - pageInfo
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
        '400':
          description: The query parameters failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: The bearer token is missing or unusable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: >-
            An internal failure the client cannot act on. The cause is recorded
            server side and deliberately absent from this body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/workspaces/{workspaceId}/members:
    get:
      operationId: listWorkspaceMembers
      tags:
        - Members
      summary: List workspace members
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
