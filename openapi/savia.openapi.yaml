        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/approvals/{approvalId}/confirm:
    parameters:
      - name: approvalId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - $ref: '#/components/parameters/WorkspaceIdHeader'
    post:
      operationId: confirmApproval
      summary: Approve exact tool arguments
      description: Only the approval creator (`createdBy`) can confirm with a user session from Savia web or mobile. For an MCP proposal, this call executes the approved action; there is no follow-up MCP call. The backend checks the argument hash and reauthorizes the caller and the bound grant inside the transaction that applies the action and consumes the approval. If a check fails, the action is not executed and the approval is not consumed.
      tags:
        - Approvals
      responses:
        '200':
          description: Approval confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
